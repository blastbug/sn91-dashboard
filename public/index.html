<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Overview · Cascade SN91</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div class="app" id="appRoot">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="workspace">
      <header class="topbar" id="topbar"></header>
      <div id="liveRail"></div>
      <div class="page">
        <div id="creditNotice" hidden></div>
        <main id="main">
          <section id="kpis"></section>
          <section class="dash-grid">
            <div class="stack">
              <div id="rankings"></div>
              <div id="performance"></div>
            </div>
            <div class="stack">
              <div id="verifyList"></div>
              <div id="validatorQueue"></div>
            </div>
            <div class="stack">
              <div id="pipelineCard"></div>
              <div id="chainHealth"></div>
              <div id="activity"></div>
            </div>
          </section>
          <section id="benchmarks"></section>
          <section id="submissions"></section>
        </main>
        <footer class="footer">
          Round, heat and receipt data from the public Cascade store (<span class="mono">s3.hippius.com/cascade-manifests</span>);
          chain data via <a href="https://taostats.io" target="_blank" rel="noopener">Taostats</a>.
        </footer>
      </div>
    </div>
  </div>
  <script type="module" src="/js/overview.js"></script>
</body>
</html>
