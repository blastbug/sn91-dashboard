<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Overview · Cascade SN91</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div class="app" id="appRoot">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="workspace">
      <header class="topbar" id="topbar"></header>
      <div id="liveRail"></div>
      <div class="page">
        <div id="creditNotice" hidden></div>
        <main id="main">
          <section id="kpis"></section>
          <section id="govStrip"></section>

          <!-- The duel board is a table: it gets a row to itself so the row
               reads across in one line rather than being folded into a column. -->
          <section id="cohort"></section>

          <!-- Quarter/three-quarters: the pipeline is a stage list and a short
               key/value block, the leaderboard is a six-column table. -->
          <section class="row-quarter">
            <div id="pipelineCard"></div>
            <div id="rankings"></div>
          </section>

          <!-- The remaining three, widest-first: the chart wants room, the
               entrant cards pair up, the rings sit in the quarter column so
               they line up under the pipeline above. -->
          <section class="row-trio">
            <div id="performance"></div>
            <div id="verifyList"></div>
            <div id="chainHealth"></div>
          </section>

          <section id="benchmarks"></section>
          <section id="submissions"></section>
        </main>
        <footer class="footer">
          Round, heat and receipt data from the public Cascade store (<span class="mono">s3.hippius.com/cascade-manifests</span>);
          chain data via <a href="https://taostats.io" target="_blank" rel="noopener">Taostats</a>.
        </footer>
      </div>
    </div>
  </div>
  <script type="module" src="/js/overview.js"></script>
</body>
</html>
